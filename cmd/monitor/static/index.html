<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Playrena — Admin Monitor</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background: #09090b; }
    .bar { transition: width .4s ease, background-color .4s ease; }
    @keyframes pulse-dot { 0%,100%{opacity:1} 50%{opacity:.3} }
    .live-dot { animation: pulse-dot 1.5s infinite; }
  </style>
</head>
<body class="text-zinc-100 font-sans min-h-screen">
  <div class="max-w-7xl mx-auto px-6 py-8">
    <!-- Header -->
    <header class="flex items-center justify-between mb-8">
      <div class="flex items-center gap-3">
        <div class="w-9 h-9 rounded-lg bg-green-500/10 border border-green-500/30 flex items-center justify-center">
          <svg class="w-5 h-5 text-green-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="2" y="2" width="20" height="8" rx="2"/><rect x="2" y="14" width="20" height="8" rx="2"/><line x1="6" y1="6" x2="6.01" y2="6"/><line x1="6" y1="18" x2="6.01" y2="18"/></svg>
        </div>
        <div>
          <h1 class="text-xl font-bold">Playrena — Monitor</h1>
          <p id="host-name" class="text-xs text-zinc-500">—</p>
        </div>
      </div>
      <div class="flex items-center gap-2 text-sm text-zinc-400">
        <span class="live-dot w-2 h-2 rounded-full bg-green-400"></span>
        <span id="last-update">connexion…</span>
      </div>
    </header>

    <!-- Host summary -->
    <section class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 mb-8">
      <div class="rounded-xl border border-zinc-800 bg-zinc-900 p-5">
        <div class="text-xs text-zinc-500 uppercase tracking-wide mb-2">RAM Hôte</div>
        <div class="flex items-end justify-between mb-2">
          <span id="host-mem-val" class="text-2xl font-bold">—</span>
          <span id="host-mem-pct" class="text-sm text-zinc-400">—</span>
        </div>
        <div class="h-2 rounded-full bg-zinc-800 overflow-hidden"><div id="host-mem-bar" class="bar h-full bg-green-500" style="width:0%"></div></div>
      </div>

      <div class="rounded-xl border border-zinc-800 bg-zinc-900 p-5">
        <div class="text-xs text-zinc-500 uppercase tracking-wide mb-2">CPU / Charge</div>
        <div class="flex items-end justify-between mb-2">
          <span id="host-load-val" class="text-2xl font-bold">—</span>
          <span id="host-cpu-count" class="text-sm text-zinc-400">—</span>
        </div>
        <div class="h-2 rounded-full bg-zinc-800 overflow-hidden"><div id="host-load-bar" class="bar h-full bg-green-500" style="width:0%"></div></div>
      </div>

      <div class="rounded-xl border border-zinc-800 bg-zinc-900 p-5">
        <div class="text-xs text-zinc-500 uppercase tracking-wide mb-2">Disque Hôte</div>
        <div class="flex items-end justify-between mb-2">
          <span id="host-disk-val" class="text-2xl font-bold">—</span>
          <span id="host-disk-pct" class="text-sm text-zinc-400">—</span>
        </div>
        <div class="h-2 rounded-full bg-zinc-800 overflow-hidden"><div id="host-disk-bar" class="bar h-full bg-green-500" style="width:0%"></div></div>
      </div>

      <div class="rounded-xl border border-zinc-800 bg-zinc-900 p-5">
        <div class="text-xs text-zinc-500 uppercase tracking-wide mb-2">Containers</div>
        <div class="flex items-end justify-between mb-2">
          <span id="ct-count" class="text-2xl font-bold">—</span>
          <span class="text-sm text-zinc-400">actifs / total</span>
        </div>
        <div class="text-xs text-zinc-600 mt-3">Playrena + infrastructure</div>
      </div>
    </section>

    <!-- Trafic réseau -->
    <section class="rounded-xl border border-zinc-800 bg-zinc-900 p-5 mb-8 flex items-center justify-between flex-wrap gap-4">
      <div class="text-xs text-zinc-500 uppercase tracking-wide">Trafic réseau (serveurs)</div>
      <div class="flex items-center gap-6">
        <div class="flex items-center gap-1.5"><span class="text-zinc-400 text-sm">↓ Entrant</span><span id="net-rx" class="font-mono font-bold text-green-400">—</span></div>
        <div class="flex items-center gap-1.5"><span class="text-zinc-400 text-sm">↑ Sortant</span><span id="net-tx" class="font-mono font-bold text-blue-400">—</span></div>
        <div class="text-xs text-zinc-600">Total <span id="net-total">—</span></div>
      </div>
    </section>

    <!-- Nodes (serveurs physiques) -->
    <section class="mb-8">
      <h2 class="text-sm font-semibold text-zinc-400 uppercase tracking-wide mb-4">Nodes (serveurs physiques)</h2>
      <div id="nodes" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4"></div>
    </section>

    <!-- Containers -->
    <section class="mb-8">
      <h2 class="text-sm font-semibold text-zinc-400 uppercase tracking-wide mb-4">Containers</h2>
      <div id="containers" class="grid grid-cols-1 lg:grid-cols-2 gap-4"></div>
    </section>

    <!-- Utilisateurs -->
    <section>
      <h2 class="text-sm font-semibold text-zinc-400 uppercase tracking-wide mb-4">Utilisateurs <span id="user-count" class="text-zinc-600"></span></h2>
      <div class="rounded-xl border border-zinc-800 bg-zinc-900 overflow-x-auto">
        <table class="w-full text-sm">
          <thead>
            <tr class="text-left text-xs text-zinc-500 border-b border-zinc-800">
              <th class="px-4 py-3 font-medium">Utilisateur</th>
              <th class="px-4 py-3 font-medium">Email</th>
              <th class="px-4 py-3 font-medium">Plan</th>
              <th class="px-4 py-3 font-medium">Serveurs</th>
              <th class="px-4 py-3 font-medium">Inscrit</th>
            </tr>
          </thead>
          <tbody id="users"></tbody>
        </table>
      </div>
    </section>
  </div>

  <script>
    const fmtMB = (mb) => mb >= 1024 ? (mb/1024).toFixed(2)+' GB' : mb.toFixed(0)+' MB';
    const fmtUptime = (s) => {
      if (!s) return '';
      const d = Math.floor(s/86400), h = Math.floor((s%86400)/3600), m = Math.floor((s%3600)/60);
      if (d) return `${d}j ${h}h`; if (h) return `${h}h ${m}m`; return `${m}m`;
    };
    const barColor = (p) => p >= 90 ? 'bg-red-500' : p >= 70 ? 'bg-yellow-500' : 'bg-green-500';

    function renderContainer(c) {
      const running = c.state === 'running';
      const memPct = Math.min(c.mem_percent || 0, 100);
      const cpuPct = Math.min(c.cpu_percent || 0, 100);
      const stateColor = running ? 'bg-green-400' : c.state === 'exited' ? 'bg-red-400' : 'bg-zinc-500';
      return `
        <div class="rounded-xl border ${c.managed ? 'border-green-800/60' : 'border-zinc-800'} bg-zinc-900 p-5">
          <div class="flex items-center justify-between mb-4">
            <div class="flex items-center gap-2 min-w-0">
              <span class="w-2.5 h-2.5 rounded-full shrink-0 ${stateColor}"></span>
              <span class="font-semibold truncate">${c.name}</span>
              <span class="text-[10px] font-semibold text-blue-300 bg-blue-500/10 px-1.5 py-0.5 rounded shrink-0">${c.node}</span>
              ${c.managed ? '<span class="text-[10px] font-semibold text-green-400 bg-green-500/10 px-1.5 py-0.5 rounded shrink-0">Playrena</span>' : ''}
            </div>
            <span class="text-xs text-zinc-500 shrink-0">${fmtUptime(c.uptime_secs)}</span>
          </div>
          <div class="text-[11px] text-zinc-600 mb-4 truncate">${c.image}</div>

          ${running ? `
          <div class="space-y-3">
            <div>
              <div class="flex justify-between text-xs mb-1"><span class="text-zinc-400">CPU ${c.cpu_limit ? '<span class="text-zinc-500">· '+c.cpu_limit.toFixed(c.cpu_limit % 1 ? 1 : 0)+' cœur'+(c.cpu_limit>1?'s':'')+' alloué'+(c.cpu_limit>1?'s':'')+'</span>' : '<span class="text-zinc-600">· illimité</span>'}</span><span class="font-mono">${cpuPct.toFixed(1)}%</span></div>
              <div class="h-1.5 rounded-full bg-zinc-800 overflow-hidden"><div class="bar h-full ${barColor(cpuPct)}" style="width:${cpuPct}%"></div></div>
            </div>
            <div>
              <div class="flex justify-between text-xs mb-1"><span class="text-zinc-400">RAM</span><span class="font-mono">${fmtMB(c.mem_usage_mb)}${c.mem_limit_mb && c.mem_limit_mb < 1e7 ? ' / '+fmtMB(c.mem_limit_mb) : ''}</span></div>
              <div class="h-1.5 rounded-full bg-zinc-800 overflow-hidden"><div class="bar h-full ${barColor(memPct)}" style="width:${memPct}%"></div></div>
            </div>
            <div class="flex justify-between text-xs pt-1 text-zinc-500">
              <span>Disque (rw) <span class="text-zinc-300 font-mono">${fmtMB(c.disk_rw_mb)}</span></span>
              <span>↓${c.net_rx_mb.toFixed(1)} ↑${c.net_tx_mb.toFixed(1)} MB</span>
            </div>
          </div>` : `
          <div class="text-sm text-zinc-600 mb-3">${c.status}</div>`}

          <!-- Actions admin -->
          <div class="flex gap-2 mt-4 pt-3 border-t border-zinc-800">
            ${running ? `<button onclick="ctrl('${c.id}','stop','${c.name}')" class="flex-1 text-xs font-medium py-1.5 rounded-md bg-zinc-800 hover:bg-yellow-900/60 text-yellow-400 transition-colors">Forcer l'arrêt</button>` : ''}
            <button onclick="ctrl('${c.id}','delete','${c.name}')" class="flex-1 text-xs font-medium py-1.5 rounded-md bg-zinc-800 hover:bg-red-900/60 text-red-400 transition-colors">Supprimer</button>
          </div>
        </div>`;
    }

    async function ctrl(id, action, name) {
      const verb = action === 'stop' ? "forcer l'arrêt de" : "SUPPRIMER";
      if (!confirm(`Veux-tu vraiment ${verb} le container "${name}" ?`)) return;
      try {
        const res = await fetch(`api/containers/${id}/${action}`, { method: 'POST' });
        if (!res.ok && res.status !== 204) alert('Erreur: ' + (await res.text()));
      } catch (e) { alert('Erreur de connexion'); }
      refresh();
    }

    async function refresh() {
      try {
        const res = await fetch('api/stats');
        if (!res.ok) throw new Error(res.status);
        const d = await res.json();
        const h = d.host;

        document.getElementById('host-name').textContent = h.hostname;
        document.getElementById('host-mem-val').textContent = fmtMB(h.mem_used_mb) + ' / ' + fmtMB(h.mem_total_mb);
        document.getElementById('host-mem-pct').textContent = h.mem_percent.toFixed(0) + '%';
        const memBar = document.getElementById('host-mem-bar');
        memBar.style.width = h.mem_percent + '%'; memBar.className = 'bar h-full ' + barColor(h.mem_percent);

        const loadPct = h.cpu_count ? Math.min(h.load1 / h.cpu_count * 100, 100) : 0;
        document.getElementById('host-load-val').textContent = h.load1.toFixed(2);
        document.getElementById('host-cpu-count').textContent = h.cpu_count + ' cœurs';
        const loadBar = document.getElementById('host-load-bar');
        loadBar.style.width = loadPct + '%'; loadBar.className = 'bar h-full ' + barColor(loadPct);

        document.getElementById('host-disk-val').textContent = h.disk_used_gb.toFixed(0) + ' / ' + h.disk_total_gb.toFixed(0) + ' GB';
        document.getElementById('host-disk-pct').textContent = h.disk_percent.toFixed(0) + '%';
        const diskBar = document.getElementById('host-disk-bar');
        diskBar.style.width = h.disk_percent + '%'; diskBar.className = 'bar h-full ' + barColor(h.disk_percent);

        document.getElementById('net-rx').textContent = h.net_rx_mbs.toFixed(2) + ' MB/s';
        document.getElementById('net-tx').textContent = h.net_tx_mbs.toFixed(2) + ' MB/s';
        document.getElementById('net-total').textContent = `↓${h.net_rx_total_gb.toFixed(1)} ↑${h.net_tx_total_gb.toFixed(1)} GB`;

        document.getElementById('ct-count').textContent = h.container_up + ' / ' + h.container_total;

        // Nodes
        document.getElementById('nodes').innerHTML = (d.nodes || []).map(n => {
          const memPct = n.mem_total_mb ? Math.min(n.mem_used_mb / n.mem_total_mb * 100, 100) : 0;
          return `
            <div class="rounded-xl border ${n.online ? 'border-zinc-800' : 'border-red-900'} bg-zinc-900 p-5">
              <div class="flex items-center justify-between mb-3">
                <span class="font-semibold flex items-center gap-2">
                  <span class="w-2 h-2 rounded-full ${n.online ? 'bg-green-400' : 'bg-red-500'}"></span>${n.id}
                </span>
                <span class="text-xs text-zinc-500">${n.cpu_count} cœurs · ${n.containers} containers</span>
              </div>
              <div class="flex justify-between text-xs mb-1"><span class="text-zinc-400">RAM serveurs</span><span class="font-mono">${fmtMB(n.mem_used_mb)} / ${fmtMB(n.mem_total_mb)}</span></div>
              <div class="h-1.5 rounded-full bg-zinc-800 overflow-hidden"><div class="bar h-full ${barColor(memPct)}" style="width:${memPct}%"></div></div>
            </div>`;
        }).join('');

        document.getElementById('containers').innerHTML = d.containers.map(renderContainer).join('');

        document.getElementById('last-update').textContent = 'à jour · ' + new Date(d.timestamp).toLocaleTimeString('fr-CA');
      } catch (e) {
        document.getElementById('last-update').textContent = 'erreur de connexion';
      }
    }

    const planColor = (p) => p === 'free' ? 'text-zinc-400' : 'text-green-400';
    async function fetchUsers() {
      try {
        const res = await fetch('api/users');
        if (!res.ok) { document.getElementById('users').innerHTML = '<tr><td colspan="5" class="px-4 py-4 text-zinc-600">Liste indisponible</td></tr>'; return; }
        const users = await res.json();
        document.getElementById('user-count').textContent = `(${users.length})`;
        document.getElementById('users').innerHTML = users.length ? users.map(u => `
          <tr class="border-b border-zinc-800/50 hover:bg-zinc-800/30">
            <td class="px-4 py-3">
              <div class="flex items-center gap-2">
                ${u.avatar ? `<img src="${u.avatar}" class="w-6 h-6 rounded-full" />` : '<div class="w-6 h-6 rounded-full bg-zinc-700"></div>'}
                <span class="font-medium">${u.username}</span>
              </div>
            </td>
            <td class="px-4 py-3 text-zinc-400">${u.email || '—'}</td>
            <td class="px-4 py-3 capitalize ${planColor(u.plan)}">${u.plan}</td>
            <td class="px-4 py-3 font-mono">${u.server_count}</td>
            <td class="px-4 py-3 text-zinc-500 text-xs">${new Date(u.created_at).toLocaleDateString('fr-CA')}</td>
          </tr>`).join('') : '<tr><td colspan="5" class="px-4 py-4 text-zinc-600">Aucun utilisateur</td></tr>';
      } catch (e) { /* ignore */ }
    }

    refresh();
    setInterval(refresh, 2000);
    fetchUsers();
    setInterval(fetchUsers, 15000);
  </script>
</body>
</html>
